
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clothing Store｜服飾商品查詢</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft JhengHei", sans-serif; background: #f6f7f9; color: #222; }
    header { background: #202b3a; color: white; padding: 30px 18px; text-align: center; }
    header h1 { margin: 0 0 10px; }
    header p { margin: 0; color: #d5dce5; }
    main { max-width: 1150px; margin: auto; padding: 24px 16px; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    input, select { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    input { flex: 2; min-width: 180px; }
    select { flex: 1; min-width: 130px; }
    .status { margin: 15px 0; color: #555; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 12px #00000012; }
    .card img { width: 100%; height: 230px; object-fit: contain; background: #f1f1f1; }
    .details { padding: 15px; }
    .details h3 { margin: 0 0 9px; font-size: 17px; }
    .price { color: #bd3344; font-weight: bold; font-size: 19px; }
    .meta { color: #666; font-size: 13px; line-height: 1.8; }
    footer { text-align: center; padding: 30px; color: #888; }
  </style>
</head>
<body>
  <header>
    <h1>Clothing Store</h1>
    <p>服飾資料庫商品查詢系統</p>
  </header>

  <main>
    <div class="filters">
      <input id="search" placeholder="搜尋商品名稱或品牌">
      <select id="category"><option value="">所有分類</option></select>
      <select id="sort">
        <option value="">預設排序</option>
        <option value="low">價格：低到高</option>
        <option value="high">價格：高到低</option>
      </select>
    </div>
    <p class="status" id="status">正在讀取資料庫商品...</p>
    <div class="grid" id="products"></div>
  </main>

  <footer>TiDB Cloud × Flask API × GitHub Pages</footer>

  <script>
    const API = "https://clothing-search-api-swnf.onrender.com/api/dashboard";
    let products = [];

    const search = document.getElementById("search");
    const category = document.getElementById("category");
    const sort = document.getElementById("sort");
    const container = document.getElementById("products");
    const status = document.getElementById("status");

    function render() {
      const keyword = search.value.trim().toLowerCase();
      let result = products.filter(p =>
        (String(p.name || "") + " " + String(p.brand || "")).toLowerCase().includes(keyword) &&
        (!category.value || p.category === category.value)
      );

      if (sort.value === "low") result.sort((a,b) => Number(a.price)-Number(b.price));
      if (sort.value === "high") result.sort((a,b) => Number(b.price)-Number(a.price));

      status.textContent = "目前顯示 " + result.length + " 件商品";
      container.replaceChildren();

      result.forEach(p => {
        const card = document.createElement("article");
        card.className = "card";

        const img = document.createElement("img");
        img.alt = p.name || "商品圖片";
        img.loading = "lazy";
        img.src = p.image_url || p.image_file || "";
        img.onerror = () => { img.onerror = null; img.style.display = "none"; };

        const details = document.createElement("div");
        details.className = "details";

        const title = document.createElement("h3");
        title.textContent = p.name || "未命名商品";

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = "NT$ " + Number(p.price || 0).toLocaleString("zh-TW");

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = [
          p.category, p.brand,
          "尺寸：" + (p.size || "未提供"),
          "顏色：" + (p.color || "未提供"),
          "庫存：" + (p.stock ?? "未提供")
        ].filter(Boolean).join("｜");

        details.append(title, price, meta);
        card.append(img, details);
        container.append(card);
      });
    }

    async function loadProducts() {
      try {
        const response = await fetch(API + "?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (!Array.isArray(data.products)) throw new Error("API 格式不正確");

        products = data.products;
        const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
        categories.forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          category.appendChild(option);
        });
        render();
      } catch (error) {
        status.textContent = "商品讀取失敗，請稍後重新整理。";
        console.error(error);
      }
    }

    search.addEventListener("input", render);
    category.addEventListener("change", render);
    sort.addEventListener("change", render);
    loadProducts();
  </script>
</body>
</html>
